name: Build REPWALA Short
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Fitness Short topic
        required: true
        type: string
      angle:
        description: Optional editorial angle
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow edge-tts
      - name: Generate script draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Add GEMINI_API_KEY in repository Actions secrets." && exit 1)
          python script_generator.py --topic "${{ inputs.topic }}" --angle "${{ inputs.angle }}"
      - name: Build narrated vertical video
        run: |
          SCRIPT_FILE="$(find output -maxdepth 1 -name '*.json' -type f | head -n 1)"
          test -n "$SCRIPT_FILE"
          python video_generator.py --input "$SCRIPT_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: repwala-short-draft
          path: |
            output/*.json
            video_output/*.mp4
          if-no-files-found: error
          retention-days: 7
